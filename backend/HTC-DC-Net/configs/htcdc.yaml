## model configuration
model: htcdc
backbone: efficientnetb0
project: HTCDC
head_tail_cut: true
prob_loss: dirac
prob_loss_bg: bg

## data configuration
batch_size: 2
num_workers: 2 

## training configuration
max_epochs: 5 
lr: 0.0001
chamfer_weight: 0.01
log_interval: 50

optimizer: AdamW

early_stopping: ['mae', 'rmse', 'val/loss_total']
early_stopping_mode: ['min', 'min', 'min']
